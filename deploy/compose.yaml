# HeurChain self-hosted stack: broker 0.6.1-oss.1 + Redis + Qdrant + Ollama embeddings.
#
#   cp deploy/.env.example deploy/.env      # then set ADMIN_USER / ADMIN_PASS
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml exec ollama ollama pull nomic-embed-text
#
# Requires Docker Compose 2.20 or later (for include).
#
# Broker image: `up -d` pulls the prebuilt image from GitHub Container Registry
# and builds from source only if it cannot be pulled; `up -d --build` always
# builds from this checkout.
#
# Embedder: the bundled Ollama (compose.ollama.yaml) is included by default.
# With an embedder you already run (Ollama on the host, or an OpenAI-compatible
# API), set HEURCHAIN_EMBEDDER_COMPOSE=compose.no-embedder.yaml in deploy/.env
# and point embed: in broker.yaml at it; the Ollama image is then not downloaded.
#
# Every port is published on 127.0.0.1 only. Put a TLS reverse proxy in front
# of the broker before exposing it to other machines (see docs/install.md).
name: heurchain

include:
  - path: ${HEURCHAIN_EMBEDDER_COMPOSE:-compose.ollama.yaml}

services:
  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/peterjohannmedina/heurchain-broker:${HEURCHAIN_BROKER_TAG:-master}
    restart: unless-stopped
    env_file: [./.env]
    environment:
      QDRANT_URL: http://qdrant:6333
    # Lets broker.yaml reach an embedder on the host as host.docker.internal.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    # HEURCHAIN_PORT changes only the host side (for example when 8080 is taken).
    ports: ["127.0.0.1:${HEURCHAIN_PORT:-8080}:8080"]
    volumes:
      - ./broker.yaml:/etc/heurchain/broker.yaml:ro
      - broker-data:/var/lib/heurchain
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes: ["qdrant-data:/qdrant/storage"]

volumes:
  broker-data:
  redis-data:
  qdrant-data:
