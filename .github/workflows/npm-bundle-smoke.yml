# End-to-end check of the npm package exactly as a user installs it:
# npm pack -> install the tarball -> heurchain init -> heurchain up (Docker
# Compose build, model pull, readiness) -> heurchain tenant -> MCP store and
# search -> agent setup preflight -> heurchain down.
name: npm bundle smoke test

on:
  pull_request:
    paths:
      - "npm/**"
      - "broker/**"
      - "deploy/**"
      - "tools/setup/**"
      - "skills/**"
      - ".github/workflows/npm-bundle-smoke.yml"
  push:
    branches: [master]
    paths:
      - "npm/**"
      - "broker/**"
      - "deploy/**"
      - "tools/setup/**"
      - "skills/**"
      - ".github/workflows/npm-bundle-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Pack the npm package
        working-directory: npm
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/heurchain-*.tgz | sort > "$RUNNER_TEMP/files.txt"
          for f in package/bin/heurchain.mjs package/broker/main.go package/broker/go.mod package/deploy/compose.yaml \
                   package/deploy/Dockerfile package/deploy/.env.example package/tools/setup/cli.mjs \
                   package/skills/heurchain-memory/SKILL.md package/docs/install.md package/AGENT_CONFIG.json; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "::error::missing from the package: $f"; exit 1; }
          done
          if grep -E '(^|/)\.env$|_test\.go$' "$RUNNER_TEMP/files.txt"; then echo "::error::package contains secrets or tests"; exit 1; fi

      - name: Install the tarball as a user would
        run: npm install -g "$RUNNER_TEMP"/heurchain-*.tgz && heurchain --version

      - name: heurchain init
        working-directory: ${{ runner.temp }}
        run: |
          heurchain init srv
          test "$(stat -c %a srv/deploy/.env)" = 600
          heurchain init srv | grep -q 'deploy/.env kept'

      - name: heurchain up
        working-directory: ${{ runner.temp }}
        run: heurchain up srv

      - name: heurchain status, tenant and MCP store/search
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          heurchain status srv | tee /dev/stderr | grep -q '"edition":"oss"'
          T=$(heurchain tenant srv --name Smoke --email smoke@example.com --json)
          TENANT=$(node -p "JSON.parse(process.argv[1]).tenant_id" "$T"); KEY=$(node -p "JSON.parse(process.argv[1]).api_key" "$T")
          echo "::add-mask::$KEY"
          mcp() { curl -fsS -X POST "$BASE/mcp/sse" -H "X-HeurChain-API-Key: $KEY" -H "X-HeurChain-Tenant: $TENANT" \
                    -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$1"; }
          mcp '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q heurchain_search
          mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"heurchain_store","arguments":{"id":"npm-smoke-1","text":"npm bundle smoke test: the canary runs for 17 minutes","agent_id":"smoke"}}}' | grep -q stored
          sleep 2
          mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"heurchain_search","arguments":{"text":"canary minutes","limit":3}}}' | grep -q npm-smoke-1
          # Agent setup preflight (dry run): verifies broker, key and tools without changing anything.
          HEURCHAIN_API_KEY="$KEY" heurchain connect --client claude --tenant "$TENANT" | grep -q '"preview":true'

      - name: heurchain down
        if: always()
        working-directory: ${{ runner.temp }}
        run: heurchain down srv || true
