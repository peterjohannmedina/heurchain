<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">HeurChain keeps 95 to 102 percent of whole-conversation accuracy on about 4% of the input tokens</title>
<desc id="d">gpt-6-luna: whole conversation 426 of 543 correct on about 117,000 tokens per question; HeurChain 436.3 correct on 4932 tokens. No memory: 0 correct. Muse Spark 1.3: whole conversation 495 of 543 correct on about 117,000 tokens per question; HeurChain 469 correct on 4887 tokens. No memory: 0 correct. DeepSeek V4.1 Flash: whole conversation 492 of 543 correct on about 117,000 tokens per question; HeurChain 467.5 correct on 5028 tokens. No memory: 0 correct.</desc>
<rect x="0.5" y="0.5" width="1199" height="559" rx="12" fill="#ffffff" stroke="#e3e2dd"/>
<text x="40" y="48" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">HeurChain keeps 95–102% of whole-conversation accuracy on about 4% of the tokens</text>
<text x="40" y="74" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">LoCoMo DEV, 543 scored questions. Same readers, judge, rubric and harness for both arms; no compression, only retrieval.</text>
<text x="40" y="94" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Without a memory system an agent either knows nothing (0 of 543 correct for every reader) or carries the whole history into every request.</text>
<text x="210" y="128" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start">Correct answers</text>
